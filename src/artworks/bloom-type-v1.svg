  <text x="80" y="520" font-family="Georgia, serif" font-size="14" fill="#2A2520" font-style="italic">The quick brown fox jumps</text>
  <text x="80" y="550" font-family="Georgia, serif" font-size="14" fill="#2A2520" font-style="italic">over the lazy dog. Pack</text>
  <text x="80" y="580" font-family="Georgia, serif" font-size="14" fill="#2A2520" font-style="italic">my box with five dozen.</text>
  <text x="80" y="660" font-family="Georgia, serif" font-size="11" fill="#6B6258" letter-spacing="2">SERIF / REGULAR / 14PT</text>
